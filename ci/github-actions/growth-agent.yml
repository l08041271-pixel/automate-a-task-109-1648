name: AI Growth Agent (recommendation only)

# Daily and weekly business review. Produces recommendations and stores a run
# record. It NEVER spends money, publishes content or changes any policy.
#
# Requires repository secret DATABASE_URL.

on:
  schedule:
    - cron: "0 6 * * *"    # daily 06:00 UTC
    - cron: "0 7 * * 1"    # weekly Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: Analysis window in days
        required: false
        default: "7"

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run growth analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENVIRONMENT: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured."
            exit 1
          fi
          python scripts/run_growth_agent.py --days "${{ github.event.inputs.days || '7' }}" | tee growth-report.txt

      - name: Publish the report to the run summary
        if: always()
        run: |
          {
            echo "## Growth report"
            echo
            echo '```'
            cat growth-report.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-report
          path: growth-report.txt
          if-no-files-found: ignore
          retention-days: 30
