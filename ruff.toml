# Ruff configuration — https://docs.astral.sh/ruff/
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is a review concern, not a lint failure
    "B008",  # FastAPI Depends() in argument defaults is idiomatic
    "UP042", # StrEnum vs str+Enum is a deliberate choice here
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
# Scripts intentionally adjust sys.path before importing the app package.
"scripts/*" = ["E402"]
